[project]
name = "musicgraph"
version = "0.1.0"
description = "Local database of music tracks: spectrograms, audio features and embeddings"
requires-python = ">=3.11,<3.13"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "numpy>=1.26",
    "librosa>=0.10.2",
    "soundfile>=0.12",
    "scikit-learn>=1.4",
    "umap-learn>=0.5.6",
    "pandas>=2.2",
    "plotly>=5.20",
    "matplotlib>=3.8",
]

[project.scripts]
mg = "musicgraph.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
full = [
    "basic-pitch[onnx]>=0.4.0",
    "demucs>=4.0.1",
    "essentia-tensorflow>=2.1b6.dev1389",
    "kymatio>=0.3.0",
    "madmom",
    "mosqito>=1.2.1",
    "muq>=0.1.0",
    "panns-inference>=0.1.1",
    "pyloudnorm>=0.2.0",
    "sentence-transformers>=6.1.0",
    "setuptools<81",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
    "torchcrepe>=0.0.24",
    "torchvision>=0.29.1",
    "transformers>=5.20.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
madmom = { git = "https://github.com/CPJKU/madmom" }

[tool.uv]
# basic-pitch hard-depends on tensorflow 2.14 (numpy<2 only); we use its ONNX backend instead
override-dependencies = ["tensorflow; sys_platform == 'never'"]
